[package]
name = "solo-reader"
version = "1.0.0"
description = "知页本地文档阅读器"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
